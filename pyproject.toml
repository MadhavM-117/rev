[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rev"
version = "0.1.0"
description = "Streamline code review for humans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "claude-agent-sdk>=0.1.39",
    "ast-grep-py>=0.41.0",
    "git-python>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
rev = "rev.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--cov=rev",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
