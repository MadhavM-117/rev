[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rev"
version = "0.1.0"
description = "Streamline code review for humans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "claude-agent-sdk>=0.1.39",
]

[project.scripts]
rev = "rev.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rev"]
